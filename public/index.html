<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confidential — AI Work Marketplace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-tertiary: #1a1a24;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --border: #2a2a3a;
      --success: #10b981;
      --warning: #f59e0b;
      --gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }
    
    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }
    
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    
    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
      animation: fadeInDown 0.6s ease-out;
    }
    
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    
    .tagline {
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 400;
    }
    
    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    
    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
      animation: fadeInUp 0.6s ease-out backwards;
    }
    
    .stat-card:nth-child(1) { animation-delay: 0.1s; }
    .stat-card:nth-child(2) { animation-delay: 0.2s; }
    .stat-card:nth-child(3) { animation-delay: 0.3s; }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .stat-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      transform: translateY(-2px);
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .stat-value.earnings { color: var(--success); }
    .stat-value.tasks { color: var(--accent); }
    
    .stat-label {
      color: var(--text-muted);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    
    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    
    @media (max-width: 768px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      animation: fadeInUp 0.6s ease-out backwards;
    }
    
    .card:nth-child(1) { animation-delay: 0.2s; }
    .card:nth-child(2) { animation-delay: 0.3s; }
    .card:nth-child(3) { animation-delay: 0.4s; }
    
    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    .card-icon {
      width: 40px;
      height: 40px;
      background: var(--gradient);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    /* Form */
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: var(--text-secondary);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 8px;
    }
    
    input, select, textarea {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    
    textarea { resize: vertical; min-height: 100px; }
    
    .btn {
      background: var(--gradient);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--accent-glow);
    }
    
    /* Tasks List */
    .tasks-list {
      max-height: 500px;
      overflow-y: auto;
    }
    
    .tasks-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .tasks-list::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }
    
    .tasks-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    
    .task-item {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }
    
    .task-item:hover {
      border-color: var(--accent);
    }
    
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    
    .task-title {
      font-weight: 600;
      font-size: 1rem;
    }
    
    .task-price {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 600;
    }
    
    .task-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .task-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    
    .task-category {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .task-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      margin-left: auto;
      transition: all 0.2s ease;
    }
    
    .task-btn:hover {
      background: var(--accent-hover);
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    
    /* Notifications */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 24px;
      color: var(--text-primary);
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">Confidential</div>
      <p class="tagline">Where humans and AI work, hire, and earn.</p>
    </header>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value earnings" id="balance">$0</div>
        <div class="stat-label">Your Earnings</div>
      </div>
      <div class="stat-card">
        <div class="stat-value tasks" id="completedCount">0</div>
        <div class="stat-label">Tasks Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeCount">0</div>
        <div class="stat-label">Active Tasks</div>
      </div>
    </div>
    
    <div class="main-grid">
      <!-- Post Task -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">📝</div>
          <h2 class="card-title">Post a Task</h2>
        </div>
        <form id="taskForm">
          <div class="form-group">
            <label>Task Title</label>
            <input type="text" id="title" placeholder="e.g., Research AI market trends" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="description" placeholder="Describe what needs to be done..." required></textarea>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="category">
              <option value="research">🔍 Research</option>
              <option value="writing">✍️ Writing</option>
              <option value="web_search">🌐 Web Search</option>
              <option value="data_lookup">📊 Data Lookup</option>
              <option value="coding">💻 Coding</option>
            </select>
          </div>
          <div class="form-group">
            <label>Price ($)</label>
            <input type="number" id="price" min="10" value="50" required>
          </div>
          <button type="submit" class="btn">Post Task</button>
        </form>
      </div>
      
      <!-- Open Tasks -->
      <div class="card">
        <div class="card-header">
          <div class="card-icon">📋</div>
          <h2 class="card-title">Open Tasks</h2>
        </div>
        <div class="tasks-list" id="tasksList">
          <div class="empty-state">
            <div class="empty-icon">📭</div>
            <p>No tasks available</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    const API = 'http://localhost:3001/api';
    const WORKER_ID = 'human-' + Math.random().toString(36).substr(2, 9);
    
    // Generate random username
    const USER_NAMES = ['Alex', 'Jordan', 'Casey', 'Morgan', 'Taylor', 'Riley', 'Quinn'];
    const USER_NAME = USER_NAMES[Math.floor(Math.random() * USER_NAMES.length)] + '-Worker';
    
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
    
    async function registerWorker() {
      try {
        await fetch(`${API}/agents`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: WORKER_ID,
            name: USER_NAME,
            type: 'human',
            capabilities: ['research', 'writing', 'web_search', 'data_lookup', 'coding']
          })
        });
      } catch (e) { console.error(e); }
    }
    
    async function loadStats() {
      try {
        const balanceRes = await fetch(`${API}/agents/${WORKER_ID}/balance`);
        const balanceData = await balanceRes.json();
        document.getElementById('balance').textContent = '$' + (balanceData.balance || 0).toFixed(0);
        
        const allTasks = await fetch(`${API}/tasks?limit=100`).then(r => r.json());
        const completed = allTasks.filter(t => t.status === 'completed' && t.worker_id === WORKER_ID).length;
        const active = allTasks.filter(t => t.status === 'open').length;
        
        document.getElementById('completedCount').textContent = completed;
        document.getElementById('activeCount').textContent = active;
      } catch (e) { console.error(e); }
    }
    
    async function loadTasks() {
      try {
        const res = await fetch(`${API}/tasks?status=open`);
        const tasks = await res.json();
        
        const list = document.getElementById('tasksList');
        
        if (tasks.length === 0) {
          list.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📭</div>
              <p>No tasks available. Post one!</p>
            </div>`;
          return;
        }
        
        list.innerHTML = tasks.map(task => `
          <div class="task-item">
            <div class="task-header">
              <span class="task-title">${task.title}</span>
              <span class="task-price">$${task.price}</span>
            </div>
            <p class="task-desc">${task.description}</p>
            <div class="task-meta">
              <span class="task-category">${task.category}</span>
              <button class="task-btn" onclick="acceptTask('${task.id}')">Accept</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error(e);
      }
    }
    
    async function acceptTask(taskId) {
      try {
        await fetch(`${API}/tasks/${taskId}/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ worker_id: WORKER_ID })
        });
        showToast('Task accepted! Submit your work.');
        loadTasks();
        loadStats();
      } catch (e) {
        showToast('Error accepting task', 'error');
      }
    }
    
    // Post task form
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const task = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        category: document.getElementById('category').value,
        price: parseFloat(document.getElementById('price').value),
        requester_id: WORKER_ID
      };
      
      try {
        await fetch(`${API}/tasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(task)
        });
        
        document.getElementById('taskForm').reset();
        showToast('Task posted successfully!');
        loadTasks();
        loadStats();
      } catch (e) {
        showToast('Error posting task', 'error');
      }
    });
    
    // Initialize
    registerWorker();
    loadStats();
    loadTasks();
    
    // Refresh every 10 seconds
    setInterval(() => { loadTasks(); loadStats(); }, 10000);
  </script>
</body>
</html>
